name: Build Android APK & Windows Companion EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify application and release versions
        run: python scripts/check_release_version.py

      - name: Set up Python for protocol checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run companion regression checks
        working-directory: pc_server
        run: |
          python -m pip install --quiet pynacl
          python -m py_compile server.py app_gui.py ecosystem.py sync.py devices_page.py streams.py library.py secure.py
          python -m unittest -v test_server.py test_ecosystem.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore or Verify Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi
          test -f app/release.keystore || (echo "Permanent keystore missing! Configure KEYSTORE_BASE64 secret or app/release.keystore." && exit 1)

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine Version Tag
        id: version_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(python scripts/check_release_version.py)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/*.apk "release-output/BT-Mouse-${{ steps.version_info.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Mouse-Release-APK
          path: release-output/*.apk
          retention-days: 30

  build-exe:
    name: Build Windows Companion EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify application and release versions
        run: python scripts/check_release_version.py

      - name: Install dependencies
        working-directory: pc_server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Render companion UI snapshots (100%)
        working-directory: pc_server
        timeout-minutes: 5
        run: python ui_snapshots.py ../ui-snapshots

      - name: Render companion UI snapshots (150%)
        working-directory: pc_server
        timeout-minutes: 5
        env:
          QT_SCALE_FACTOR: "1.5"
        run: python ui_snapshots.py ../ui-snapshots

      - name: Verify only one companion instance can run
        working-directory: pc_server
        timeout-minutes: 3
        run: |
          $first = Start-Process python -ArgumentList "app_gui.py", "--minimized" -PassThru
          Start-Sleep -Seconds 10
          if ($first.HasExited) { throw "First companion exited early with code $($first.ExitCode)" }
          $second = Start-Process python -ArgumentList "app_gui.py", "--minimized" -PassThru
          if (-not $second.WaitForExit(30000)) { Stop-Process -Id $second.Id -Force; throw "Second companion kept running" }
          if ($second.ExitCode -ne 0) { throw "Second companion exited with code $($second.ExitCode)" }
          if ($first.HasExited) { throw "First companion stopped when the second launched" }
          Stop-Process -Id $first.Id -Force
          Write-Host "Second launch exited cleanly; first instance kept running."

      - name: Upload UI Snapshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BT-Mouse-Companion-UI-Snapshots
          path: ui-snapshots/*.png
          retention-days: 14

      - name: Compile Standalone Executable
        working-directory: pc_server
        run: |
          pyinstaller BT-Mouse-Companion.spec

      - name: Upload Standalone EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Mouse-Companion-EXE
          path: pc_server/dist/BT-Mouse-Companion.exe
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-apk, build-exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Release Notes
        uses: actions/checkout@v4

      - name: Create Output Directory
        run: mkdir -p release-assets

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: BT-Mouse-Release-APK
          path: release-assets

      - name: Download EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: BT-Mouse-Companion-EXE
          path: release-assets

      - name: Verify Versioned Release Notes
        shell: bash
        run: test -f "release-notes/${GITHUB_REF_NAME}.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lanyard ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
