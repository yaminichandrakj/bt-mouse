name: Build Android APK & Windows Companion EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for protocol checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run companion regression checks
        working-directory: pc_server
        run: |
          python -m py_compile server.py app_gui.py
          python -m unittest -v test_server.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Release Keystore
        run: test -f app/release.keystore || (echo "Permanent keystore missing!" && exit 1)

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine Version Tag
        id: version_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.3.6"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/*.apk "release-output/BT-Mouse-${{ steps.version_info.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Mouse-Release-APK
          path: release-output/*.apk
          retention-days: 30

  build-exe:
    name: Build Windows Companion EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: pc_server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Standalone Executable
        working-directory: pc_server
        run: |
          pyinstaller BT-Mouse-Companion.spec

      - name: Upload Standalone EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Mouse-Companion-EXE
          path: pc_server/dist/BT-Mouse-Companion.exe
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-apk, build-exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create Output Directory
        run: mkdir -p release-assets

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: BT-Mouse-Release-APK
          path: release-assets

      - name: Download EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: BT-Mouse-Companion-EXE
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BT Remote & Companion ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
          generate_release_notes: true
