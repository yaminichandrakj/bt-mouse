name = "btmouse-rv"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# Ed25519 in WebCrypto needs this flag on older compat dates; harmless to keep.
compatibility_flags = ["nodejs_compat"]

# KV namespace that stores the signed address records.
# Create it once with:  wrangler kv namespace create RENDEZVOUS
# then paste the printed id below.
[[kv_namespaces]]
binding = "RENDEZVOUS"
id = "548077de77af4ab3ae13da56168ae053"

# Family relay: one Durable Object room per family forwards sealed messages between
# phones on different networks. SQLite-backed classes work on the free plan.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "v1-relay"
new_sqlite_classes = ["RelayRoom"]
